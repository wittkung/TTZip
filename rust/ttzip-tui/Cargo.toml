[package]
name = "ttzip-tui"
version = "0.1.0"
edition = "2021"
authors = ["Witt Kung <witt.w.kung@gmail.com>"]
description = "TTZip Modern Interactive Terminal UI and Standalone CLI Engine"
license = "LicenseRef-TTZip-Source-Available-1.0"

[[bin]]
name = "ttzip"
path = "src/main.rs"

[lib]
name = "ttzip_tui"
path = "src/lib.rs"

[dependencies]
ttzip-glue = { path = "../ttzip-glue" }
ratatui = { version = "0.28", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
fuzzy-matcher = "0.3"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.12"
